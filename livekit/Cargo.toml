[package]
name = "livekit"
version = "0.8.3"
edition.workspace = true
license.workspace = true
description = "Rust Client SDK for LiveKit"
repository.workspace = true
readme = "README.md"

# This crate is consumed as a local patch by applications that may deny all
# warnings for their own workspace. Keep upstream compatibility/deprecation
# warnings from becoming hard errors in those consumers.
[lints.rust]
warnings = "allow"

[features]
# By default ws TLS is not enabled
default = ["tokio"]

async = ["livekit-api/signal-client-async", "livekit-runtime/async"]
tokio = ["livekit-api/signal-client-tokio", "livekit-runtime/tokio"]
dispatcher = ["livekit-api/signal-client-dispatcher", "livekit-runtime/dispatcher"]

# On Wayland, libwebrtc uses GDBus to communicate with the XDG Desktop Portal.
# GDBus requires a GLib event loop to be running. Enable this feature if you
# wish to use screensharing, and you do not already have a GLib event loop
# running in your application.
glib-main-loop = [ "libwebrtc/glib-main-loop" ]

# Note that the following features only change the behavior of tokio-tungstenite.
# It doesn't change the behavior of libwebrtc/webrtc-sys
native-tls = ["livekit-api/native-tls"]
native-tls-vendored = ["livekit-api/native-tls-vendored"]
rustls-tls-native-roots = ["livekit-api/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["livekit-api/rustls-tls-webpki-roots"]
__rustls-tls = ["livekit-api/__rustls-tls"]
__lk-internal = [] # internal features (used by livekit-ffi)
__lk-e2e-test = ["livekit-data-stream/test-utils"] # end-to-end testing with a LiveKit server

[dependencies]
livekit-runtime = { version = "0.4.0", default-features = false }
livekit-api = "0.6.3"
libwebrtc = "0.3.45"
livekit-protocol = "0.7.12"
livekit-common = "0.1.1"
livekit-data-stream = "0.1.2"
livekit-datatrack = "0.1.13"
prost = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = { version = "0.12" }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
thiserror = "1.0"
lazy_static = "1.4"
log = "0.4"
chrono = "0.4.38"
semver = "1.0"
libloading = { version = "0.8.6" }
bytes = "1.10.1"
bmrng = "0.5.2"
flate2 = "1"
base64 = "0.22"

[dev-dependencies]
# Enable data-stream test constructors (e.g. TextStreamReader::new_for_test) for our test suites.
livekit-data-stream = { version = "0.1.2", features = ["test-utils"] }
# Async test runtime + timers, needed by the peer_transport deadlock reproducer.
# (rt/time are already built elsewhere in the workspace, so no new crates enter the lockfile.)
tokio = { version = "1", features = ["rt", "macros", "time"] }
anyhow = "1.0.99"
test-log = "0.2.18"
test-case = "3.3"
serial_test = "3.0"
http = "1.1"
rand = "0.9"
