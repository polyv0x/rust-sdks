[package]
name = "webrtc-sys"
version = "0.3.42"
edition.workspace = true
homepage = "https://livekit.io"
license.workspace = true
description = "Unsafe bindings to libwebrtc"
repository.workspace = true

[features]
default = []
# Builds the native encoder regression harness; not needed by SDK consumers.
test-support = ["decoder_tests"]
# cxx-build does not normalize hyphens in conditional bridge feature names.
decoder_tests = []
# Explicitly exclude SDK sample codecs when applications provide their own backends.
disable-nvidia-samples = []

[dependencies]
cxx = "1.0"
log = { workspace = true }

[build-dependencies]
webrtc-sys-build = { workspace = true }
cxx-build = "1.0"
glob = "0.3"
cc = { workspace = true }
pkg-config = "0.3.22"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.22"

[dev-dependencies]
env_logger = { workspace = true }
